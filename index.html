<style>

<script>
window.wbFx=(function(){
const WH=[0,2,4,5,7,9,11,12],BL={1:30,3:60,6:120,8:150,10:180};
function kb(h,l){h=h.split(',').map(Number);l=l?l.split(','):[];let s='<svg viewBox="0 0 241 100" class="d">';
WH.forEach((n,i)=>{const k=h.indexOf(n);s+=`<rect x="${i*30}" y="1" width="30" height="96" class="wk${k>=0?' hl':''}"/>`;if(k>=0)s+=`<text x="${i*30+15}" y="88" class="lb" text-anchor="middle">${l[k]||''}</text>`});
for(const n in BL){const k=h.indexOf(+n);s+=`<rect x="${BL[n]-9}" y="1" width="18" height="58" class="bk${k>=0?' hl2':''}"/>`;if(k>=0)s+=`<text x="${BL[n]}" y="50" class="lb" text-anchor="middle">${l[k]||''}</text>`}
return s+'</svg>'}
const G={C:[-1,3,2,0,1,0],G:[3,2,0,0,0,3],D:[-1,-1,0,2,3,2],A:[-1,0,2,2,2,0],E:[0,2,2,1,0,0],Am:[-1,0,2,2,1,0],Dm:[-1,-1,0,2,3,1],Em:[0,2,2,0,0,0],F:[1,3,3,2,1,1]};
function gt(n){const f=G[n];let s=`<svg viewBox="0 0 100 120" class="g"><text x="50" y="13" text-anchor="middle" class="gt">${n}</text>`;
for(let i=0;i<6;i++)s+=`<line x1="${15+i*14}" y1="28" x2="${15+i*14}" y2="108" stroke="var(--mut)"/>`;
for(let i=0;i<6;i++)s+=`<line x1="15" y1="${28+i*16}" x2="85" y2="${28+i*16}" stroke="var(--mut)" stroke-width="${i?1:3}"/>`;
f.forEach((v,i)=>{const x=15+i*14;if(v<0)s+=`<text x="${x}" y="25" text-anchor="middle" font-size="10" fill="var(--mut)">×</text>`;else if(v==0)s+=`<circle cx="${x}" cy="22" r="3" fill="none" stroke="var(--fg)"/>`;else s+=`<circle cx="${x}" cy="${28+(v-.5)*16}" r="5.5" fill="var(--ac2)"/>`});
return s+'</svg>'}
const NP={C:-2,D:-1,E:0,F:1,G:2,A:3,B:4,C5:5,D5:6};
function stf(a){const n=a.split(',');const w=n.length*36+50;let s=`<svg viewBox="0 0 ${w} 100" class="d" style="max-width:${Math.min(w*1.6,520)}px">`;
for(let i=0;i<5;i++)s+=`<line x1="5" y1="${20+i*10}" x2="${w-5}" y2="${20+i*10}" stroke="var(--fg)"/>`;
s+=`<text x="8" y="62" font-size="46" fill="var(--fg)">𝄞</text>`;
n.forEach((v,i)=>{const m=v.match(/^([A-G]5?)([#b]?)$/),p=NP[m[1]],x=58+i*36,y=60-p*5,ac=m[2]=='#'?'♯':m[2]=='b'?'♭':'';
if(p<=-2)s+=`<line x1="${x-11}" y1="70" x2="${x+11}" y2="70" stroke="var(--fg)"/>`;
s+=`<ellipse cx="${x}" cy="${y}" rx="6.5" ry="5" fill="var(--ac2)"/>`;if(ac)s+=`<text x="${x-18}" y="${y+5}" font-size="15" fill="var(--fg)">${ac}</text>`;
s+=`<text x="${x}" y="96" text-anchor="middle" style="font:600 10px system-ui" fill="var(--mut)">${m[1].replace('5','')+ac}</text>`});return s+'</svg>'}
function cf(){const M=['C','G','D','A','E','B','F♯','D♭','A♭','E♭','B♭','F'],m=['Am','Em','Bm','F♯m','C♯m','G♯m','D♯m','B♭m','Fm','Cm','Gm','Dm'];let s='<svg viewBox="0 0 300 300" class="d" style="max-width:380px"><circle cx="150" cy="150" r="142" fill="var(--card)" stroke="var(--bd)"/><circle cx="150" cy="150" r="90" fill="none" stroke="var(--bd)"/>';
M.forEach((c,i)=>{const a=i*Math.PI/6-Math.PI/2,ca=Math.cos(a),sa=Math.sin(a);s+=`<text x="${150+ca*116}" y="${156+sa*116}" text-anchor="middle" style="font:700 18px system-ui" fill="var(--ac)">${c}</text><text x="${150+ca*66}" y="${155+sa*66}" text-anchor="middle" style="font:600 13px system-ui" fill="var(--ac2)">${m[i]}</text>`});
return s+'<text x="150" y="146" text-anchor="middle" style="font:700 11px system-ui" fill="var(--mut)">CÍRCULO DE</text><text x="150" y="162" text-anchor="middle" style="font:700 11px system-ui" fill="var(--mut)">QUINTAS</text></svg>'}
const N={C:0,'C#':1,Db:1,D:2,Eb:3,E:4,F:5,'F#':6,G:7,Ab:8,A:9,Bb:10,B:11};
function fb(a){const[l,t]=a.split('|'),sc=l.split(',').map(x=>N[x]),tn=N[t],O=[4,9,2,7,11,4];let s='<svg viewBox="0 0 100 114" class="g" style="width:180px;display:block;margin:10px auto">';
for(let i=0;i<6;i++)s+=`<line x1="${15+i*14}" y1="30" x2="${15+i*14}" y2="94" stroke="var(--mut)"/>`;
for(let r=0;r<5;r++)s+=`<line x1="15" y1="${30+r*16}" x2="85" y2="${30+r*16}" stroke="var(--mut)" stroke-width="${r?1:3}"/>`;
O.forEach((o,i)=>{for(let f=0;f<5;f++){const n=(o+f)%12;if(!sc.includes(n))continue;const x=15+i*14,c=n==tn?'var(--ac)':'var(--ac2)';s+=f?`<circle cx="${x}" cy="${30+(f-.5)*16}" r="5.5" fill="${c}"/>`:`<circle cx="${x}" cy="22" r="4" fill="none" stroke="${c}" stroke-width="2"/>`}});
return s+`<text x="50" y="110" text-anchor="middle" style="font:600 9px system-ui" fill="var(--mut)">laranja = tônica</text></svg>`}
const fx=h=>h.replace(/\[(kb|gt|gg|st|cf|fb|pt):([^\]]*)\]/g,(_,t,a)=>{if(t=='kb'){const[p,l]=a.split('|');return kb(p,l)}if(t=='st')return stf(a);if(t=='cf')return cf();if(t=='fb')return fb(a);if(t=='pt')return pt(a);return t=='gt'?gt(a):`<div class="gr">${a.split(',').map(gt).join('')}</div>`});
Object.assign(NP,{E5:7,F5:8,G5:9,A5:10});
function pt(a){return a.split('//').map((z,si)=>{let x=56,b='';let lab='';
z.trim().split(/\s+/).forEach(e=>{
if(/^\d\/\d$/.test(e)){const[n,d]=e.split('/');b+=`<text x="${x-4}" y="40" font-size="22" font-weight="800" fill="var(--fg)" font-family="Arial,sans-serif">${n}</text><text x="${x-4}" y="60" font-size="22" font-weight="800" fill="var(--fg)" font-family="Arial,sans-serif">${d}</text>`;x+=28;return}
if(e=='|'){b+=`<line x1="${x-6}" y1="20" x2="${x-6}" y2="60" stroke="var(--fg)"/>`;x+=10;return}
if(e[0]=='~'){lab=e.slice(1);return}
const k=e.lastIndexOf('.'),d=e.slice(k+1),ms=e.slice(0,k).split('+').map(v=>v.match(/^([A-G]5?)([#b]?)$/)),P=ms.map(m=>NP[m[1]]),Y=P.map(q=>60-q*5);
ms.forEach((m,j)=>{const y=Y[j],ac=m[2]=='#'?'♯':m[2]=='b'?'♭':'';
if(P[j]<=-2)b+=`<line x1="${x-11}" y1="70" x2="${x+11}" y2="70" stroke="var(--fg)"/>`;
if(P[j]>=10)b+=`<line x1="${x-11}" y1="10" x2="${x+11}" y2="10" stroke="var(--fg)"/>`;
b+=`<ellipse cx="${x}" cy="${y}" rx="${d=='w'?7.5:6.5}" ry="5" fill="${d=='q'?'var(--ac2)':'var(--card)'}" stroke="var(--ac2)" stroke-width="2"/>`;
if(ac)b+=`<text x="${x-19}" y="${y+5}" font-size="15" fill="var(--fg)">${ac}</text>`});
if(d!='w'){const lo=Math.max(...Y),hi=Math.min(...Y);b+=Math.min(...P)<4?`<line x1="${x+6.3}" y1="${lo}" x2="${x+6.3}" y2="${hi-28}" stroke="var(--ac2)" stroke-width="2"/>`:`<line x1="${x-6.3}" y1="${hi}" x2="${x-6.3}" y2="${lo+28}" stroke="var(--ac2)" stroke-width="2"/>`}
if(lab){b+=`<text x="${x}" y="11" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ac)" font-family="Arial,sans-serif">${lab}</text>`;lab=''}
x+=d=='w'?64:d=='h'?50:36});
const w=x+8;let L='';for(let i=0;i<5;i++)L+=`<line x1="5" y1="${20+i*10}" x2="${w-5}" y2="${20+i*10}" stroke="var(--fg)"/>`;
L+=`<text x="8" y="62" font-size="46" fill="var(--fg)">𝄞</text><line x1="${w-12}" y1="20" x2="${w-12}" y2="60" stroke="var(--fg)"/><line x1="${w-7}" y1="20" x2="${w-7}" y2="60" stroke="var(--fg)" stroke-width="3"/>`;
return `<svg viewBox="0 0 ${w} 96" class="d" style="max-width:${Math.min(w*1.5,580)}px">${L}${b}</svg>`}).join('')}

return fx})();
</script>
<script>
const $=s=>document.querySelector(s),A=$("#app");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const RT=new URLSearchParams(location.search).get("reset");
let me=null,modo="register",sel=new Set(),asAluno=false,quiz=null;
async function api(p,body){const r=await fetch(p,{method:body?"POST":"GET",headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.erro||"Erro");return j}
const brl=v=>"R$ "+v.toFixed(2).replace(".",",");
const total=()=>(sel.has("trimestral")?24.99:0)+(sel.has("ebook")?19.9:0);
const semOk=n=>me.sem[n]&&me.sem[n].p/me.sem[n].t>=.5;
const liberada=n=>n==1||(me.ent.trimestral&&semOk(n-1));

/* ---------- QR Code ---------- */
/* Gerador de QR Code (byte, correção M, versões 1-10) */
function wbQR(text){
  const ECC=[10,16,26,18,24,16,18,22,22,26],NB=[1,1,1,2,2,4,4,4,5,5];
  const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r};
  const data=[...new TextEncoder().encode(text)];
  let ver=1,cap=0;
  for(;ver<=10;ver++){cap=Math.floor(raw(ver)/8)-ECC[ver-1]*NB[ver-1];if(4+(ver<=9?8:16)+data.length*8<=cap*8)break}
  if(ver>10)throw new Error("texto longo demais");
  const bits=[],put=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>>i)&1)};
  put(4,4);put(data.length,ver<=9?8:16);data.forEach(b=>put(b,8));
  put(0,Math.min(4,cap*8-bits.length));put(0,(8-bits.length%8)%8);
  for(let p=0xEC;bits.length<cap*8;p^=0xEC^0x11)put(p,8);
  const cw=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=b<<1|bits[i+j];cw.push(b)}
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
  const nb=NB[ver-1],el=ECC[ver-1],rc=Math.floor(raw(ver)/8),ns=nb-rc%nb,sl=Math.floor(rc/nb);
  const div=Array(el).fill(0);div[el-1]=1;let root=1;
  for(let i=0;i<el;i++){for(let j=0;j<el;j++){div[j]=mul(div[j],root);if(j+1<el)div[j]^=div[j+1]}root=mul(root,2)}
  const blocks=[];let k=0;
  for(let i=0;i<nb;i++){const d=cw.slice(k,k+sl-el+(i<ns?0:1));k+=d.length;
    const r=Array(el).fill(0);for(const b of d){const f=b^r.shift();r.push(0);div.forEach((c,x)=>r[x]^=mul(c,f))}
    if(i<ns)d.push(0);blocks.push(d.concat(r))}
  const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!=sl-el||j>=ns)all.push(b[i])});
  const size=ver*4+17,M=Array.from({length:size},()=>Array(size).fill(false)),F=Array.from({length:size},()=>Array(size).fill(false));
  const set=(x,y,c)=>{M[y][x]=c;F[y][x]=true},bit=(v,i)=>((v>>>i)&1)!=0;
  for(let i=0;i<size;i++){set(6,i,i%2==0);set(i,6,i%2==0)}
  const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),x=cx+dx,y=cy+dy;if(x>=0&&x<size&&y>=0&&y<size)set(x,y,d!=2&&d!=4)}};
  finder(3,3);finder(size-4,3);finder(3,size-4);
  if(ver>1){const n=Math.floor(ver/7)+2,st=Math.floor((ver*8+n*3+5)/(n*4-4))*2,pos=[6];
    for(let p=size-7;pos.length<n;p-=st)pos.splice(1,0,p);
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){if((i==0&&j==0)||(i==0&&j==n-1)||(i==n-1&&j==0))continue;
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(pos[i]+dx,pos[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1)}}
  const fmt=m=>{const d=m;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=(d<<10|r)^0x5412;
    for(let i=0;i<=5;i++)set(8,i,bit(b,i));set(8,7,bit(b,6));set(8,8,bit(b,7));set(7,8,bit(b,8));
    for(let i=9;i<15;i++)set(14-i,8,bit(b,i));
    for(let i=0;i<8;i++)set(size-1-i,8,bit(b,i));for(let i=8;i<15;i++)set(8,size-15+i,bit(b,i));set(8,size-8,true)};
  fmt(0);
  if(ver>=7){let r=ver;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=ver<<12|r;
    for(let i=0;i<18;i++){const a=size-11+i%3,c=Math.floor(i/3);set(a,c,bit(b,i));set(c,a,bit(b,i))}}
  let i=0;
  for(let right=size-1;right>=1;right-=2){if(right==6)right=5;
    for(let v=0;v<size;v++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)==0,y=up?size-1-v:v;
      if(!F[y][x]&&i<all.length*8){M[y][x]=bit(all[i>>>3],7-(i&7));i++}}}
  const apply=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++){let inv;
    switch(m){case 0:inv=(x+y)%2==0;break;case 1:inv=y%2==0;break;case 2:inv=x%3==0;break;case 3:inv=(x+y)%3==0;break;
      case 4:inv=(Math.floor(x/3)+Math.floor(y/2))%2==0;break;case 5:inv=x*y%2+x*y%3==0;break;
      case 6:inv=(x*y%2+x*y%3)%2==0;break;default:inv=((x+y)%2+x*y%3)%2==0}
    if(!F[y][x]&&inv)M[y][x]=!M[y][x]}};
  const penalty=()=>{let p=0;
    for(let t=0;t<2;t++){const g=(a,b)=>t?M[b][a]:M[a][b];
      for(let a=0;a<size;a++){let run=1;for(let b=1;b<size;b++){if(g(a,b)==g(a,b-1)){run++;if(run==5)p+=3;else if(run>5)p++}else run=1}
        const line=[];for(let b=0;b<size;b++)line.push(g(a,b)?1:0);const s=line.join("");
        for(const pat of["10111010000","00001011101"]){let idx=-1;while((idx=s.indexOf(pat,idx+1))>=0)p+=40}}}
    for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=M[y][x];if(c==M[y][x+1]&&c==M[y+1][x]&&c==M[y+1][x+1])p+=3}
    let dark=0;for(const r of M)for(const c of r)if(c)dark++;
    p+=Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10;return p};
  let best=0,bp=Infinity;
  for(let m=0;m<8;m++){apply(m);fmt(m);const s=penalty();if(s<bp){bp=s;best=m}apply(m)}
  apply(best);fmt(best);
  return M;
}
